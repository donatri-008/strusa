name: strusa
description: Aplikasi Kasir dan POS Modern
publish_to: 'none'
version: 1.0.3+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  shared_preferences: ^2.2.2
  share_plus: ^12.0.1
  get: ^4.6.6
  flutter_blue_plus: ^1.36.8
  esc_pos_printer_plus: ^0.1.1
  esc_pos_utils_plus: ^2.0.1
  path_provider: ^2.1.1
  image: ^4.0.17
  google_generative_ai: ^0.4.0
  csv: ^6.0.0
  excel: ^4.0.6
  open_filex: ^4.5.0
  pdf: ^3.10.4
  syncfusion_flutter_charts: ^33.2.3
  barcode_widget: ^2.0.3
  permission_handler: ^12.0.1
  mobile_scanner: ^7.2.0
  cupertino_icons: ^1.0.8
  file_picker: ^8.1.6
  open_settings_plus: ^0.4.2
  package_info_plus: ^9.0.1
 
  # Animasi & UI
  lottie: ^3.1.0
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  intl: ^0.20.2
  fl_chart: ^1.2.0
  badges: ^3.1.2
  animated_bottom_navigation_bar: ^1.3.3
  http: ^1.6.0
  image_picker: ^1.1.2
  firebase_storage: ^13.3.0
  flutter_launcher_icons: ^0.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"

  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
 
  assets:
    - assets/lottie/
    - assets/logo.png
 
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700